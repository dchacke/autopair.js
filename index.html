<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autopair Test</title>
</head>
<body>
  <h1>Autopair Test</h1>
  <textarea id="editor" rows="10" cols="50" autofocus></textarea>

  <script type="module">
    import autopair from './src/autopair.js';

    // Use the autopair module
    const textarea = document.getElementById('editor');

    // If using Node style exports in browser, we can attach manually for testing:
    // const autopair = window.autopair || module?.exports;

    // Visit index.html?defaults to test the default pairs, or
    // index.html?pairs=<JSON> to test other custom pairs
    const params = new URLSearchParams(location.search);
    const useDefaults = params.has('defaults');

    autopair(textarea, useDefaults ? undefined : params.has('pairs') ? JSON.parse(params.get('pairs')) : {
      '(': ')',
      '[': ']',
      '{': '}',
      "'": "'",
      '"': '"',
      '‘': '’',
      '“': '”',
      '*': '*',
      '_': '_',
      '`': '`'
    });
  </script>
</body>
</html>
